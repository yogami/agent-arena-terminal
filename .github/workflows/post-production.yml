name: Post-Production Pipeline

on:
  workflow_run:
    workflows: ['Pre-Production Pipeline']
    types: [completed]
    branches: [main]

env:
  PRODUCTION_URL: https://agent-arena-terminal-production.up.railway.app

jobs:
  smoke-test:
    name: Smoke Test (Health Check)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Railway Deployment
        run: |
          echo "Waiting for Railway to deploy..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed on attempt $i"
              curl -s "$PRODUCTION_URL/health" | python3 -m json.tool
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 5s..."
            sleep 5
          done
          echo "Deployment health check failed after 5 minutes"
          exit 1

  contract-verification:
    name: Contract Verification (Production)
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java (for Specmatic)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download Specmatic
        run: curl -L https://github.com/znsio/specmatic/releases/download/1.3.26/specmatic.jar -o specmatic.jar
      - name: Run Specmatic Against Production
        run: java -jar specmatic.jar test --host=agent-arena-terminal-production.up.railway.app --port=443 --protocol=https

  e2e-acceptance:
    name: E2E Acceptance (Playwright)
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/frontend
      - name: Run Playwright Against Production
        run: npx playwright test --config=playwright.production.config.ts
        working-directory: apps/frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PRODUCTION_URL }}
