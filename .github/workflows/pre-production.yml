name: Pre-Production Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Code Quality (Lint + Format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint Backend
        run: npm run lint --workspace=apps/backend
      - name: Lint Frontend
        run: npm run lint --workspace=apps/frontend
      - name: Check Formatting
        run: npx prettier --check .

  security-gate:
    name: Security (Audit + SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Dependency Audit
        run: npm audit --audit-level=high || true
      - name: Setup Python (for njsscan)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install njsscan
        run: pip install njsscan
      - name: Run SAST Scan
        run: njsscan --json --missing-controls apps/backend/ || true

  unit-tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Backend Unit Tests
        run: npm run test --workspace=apps/backend

  contract-tests:
    name: Contract Tests (Specmatic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Setup Java (for Specmatic)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Download Specmatic
        run: curl -L https://github.com/znsio/specmatic/releases/download/1.3.26/specmatic.jar -o specmatic.jar
      - name: Start Backend Server
        run: npm run start --workspace=apps/backend &
      - name: Wait for Server
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:3000/health && break
            echo "Waiting for server... attempt $i"
            sleep 1
          done
      - name: Run Specmatic Contract Tests
        run: java -jar specmatic.jar test --host=localhost --port=3000
